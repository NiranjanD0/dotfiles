$mainMod = SUPER

# Reload (does NOT reload plugins, but you already know the lie)
bind = $mainMod, R, exec, killall waybar && waybar && hyprctl reload

bind = $mainMod Shift, Q, exit
bind = $mainMod, T, exec, $terminal
bind = $mainMod, F, exec, $filemanager
bind = $mainMod, B, exec, $browser
bind = $mainMod, S, exec, $menu
bind = $mainMod, C, exec, code
bind = $mainMod, V, exec, antigravity

# ─────────────────────────────
# VIRTUAL DESKTOP SWITCHING
# ─────────────────────────────
bind = $mainMod, 1, vdesk, 1
bind = $mainMod, 2, vdesk, 2
bind = $mainMod, 3, vdesk, 3
bind = $mainMod, 4, vdesk, 4
bind = $mainMod, 5, vdesk, 5
bind = $mainMod, 6, vdesk, 6
bind = $mainMod, 7, vdesk, 7
bind = $mainMod, 8, vdesk, 8
bind = $mainMod, 9, vdesk, 9
bind = $mainMod, 0, vdesk, 10

# ─────────────────────────────
# MOVE WINDOW TO VDESK
# ─────────────────────────────
bind = $mainMod SHIFT, 1, movetodesk, 1
bind = $mainMod SHIFT, 2, movetodesk, 2
bind = $mainMod SHIFT, 3, movetodesk, 3
bind = $mainMod SHIFT, 4, movetodesk, 4
bind = $mainMod SHIFT, 5, movetodesk, 5
bind = $mainMod SHIFT, 6, movetodesk, 6
bind = $mainMod SHIFT, 7, movetodesk, 7
bind = $mainMod SHIFT, 8, movetodesk, 8
bind = $mainMod SHIFT, 9, movetodesk, 9
bind = $mainMod SHIFT, 0, movetodesk, 10

# ─────────────────────────────
# OLD WORKSPACE LOGIC (DISABLED)
# ─────────────────────────────
# bind = $mainMod SHIFT, left, movetoworkspacesilent, e-1
# bind = $mainMod SHIFT, right, movetoworkspacesilent, e+1
# bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
# bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
# bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
# bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
# bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
# bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
# bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
# bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
# bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
# bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

bind = $mainMod, M, fullscreen, 1

# ─────────────────────────────
# MOUSE
# ─────────────────────────────
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, mouse:272, movewindow

# ─────────────────────────────
# FOCUS
# ─────────────────────────────
bind = Alt, Tab, cyclenext
bind = $mainMod, up, exec, hyprctl dispatch movefocus u && hyprctl dispatch bringactivetotop
bind = $mainMod, down, exec, hyprctl dispatch movefocus d && hyprctl dispatch bringactivetotop
bind = $mainMod, right, exec, hyprctl dispatch movefocus r && hyprctl dispatch bringactivetotop
bind = $mainMod, left, exec, hyprctl dispatch movefocus l && hyprctl dispatch bringactivetotop

bind = $mainMod, Q, killactive
bind = $mainMod, Space, togglefloating

# ─────────────────────────────
# FUNCTION KEYS
# ─────────────────────────────
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ─────────────────────────────
# SCREENSHOT
# ─────────────────────────────
bind = , Print, exec, /home/rio/dotfiles/scripts/screenshot.sh
#bind = , Print, exec, sh -c "env QT_QPA_PLATFORM=xcb QT_AUTO_SCREEN_SCALE_FACTOR=0 flameshot gui"

# ─────────────────────────────➜ 
# POWER MENU
# ─────────────────────────────
bind = ALT, F4, exec, /home/rio/dotfiles/scripts/power_menu.sh

# ─────────────────────────────
# WAYBAR
# ─────────────────────────────
bind = $mainMod, slash, exec, pkill -USR1 waybar

# ─────────────────────────────
# COPILOT KEY
# ─────────────────────────────
# bind = SUPER SHIFT, XF86Assistant, exec, kitty

# ─────────────────────────────
# Matuwall
# ─────────────────────────────
bind = $mainMod, backslash, exec, matuwall --show

